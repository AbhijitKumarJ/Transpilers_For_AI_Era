name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/psc

      - name: Test with coverage
        run: pytest --cov=psc --cov-report=term-missing --cov-fail-under=90

  cli-smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify console script
        run: |
          psc --version
          psc --help

  generated-code:
    name: Generated code validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install compiler
        run: python -m pip install .

      - name: Build commerce sample
        run: psc build tests/fixtures/commerce_sample/Commerce.psproj --out-dir build/commerce

      - name: Pyright strict
        run: |
          cat > build/commerce/pyrightconfig.json <<'EOF'
          {
            "typeCheckingMode": "strict",
            "pythonVersion": "3.11",
            "include": ["**/*.py"]
          }
          EOF
          npx --yes pyright@1.1.413 -p build/commerce

  packaging:
    name: Wheel clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/psc-wheel"
          "$RUNNER_TEMP/psc-wheel/bin/python" -m pip install dist/*.whl

      - name: External project smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/psc-external/Services"
          cat > "$RUNNER_TEMP/psc-external/Clean.psproj" <<'EOF'
          <Project>
            <PropertyGroup>
              <AssemblyName>Clean</AssemblyName>
              <OutputPath>dist</OutputPath>
            </PropertyGroup>
          </Project>
          EOF
          cat > "$RUNNER_TEMP/psc-external/Services/Hello.ps" <<'EOF'
          namespace Clean.Services;

          using PythonSharp.Core;

          public class Hello
          {
              public string Greet(string name) => $"Hello, {name}!";
          }
          EOF
          cd "$RUNNER_TEMP/psc-external"
          "$RUNNER_TEMP/psc-wheel/bin/psc" check Clean.psproj
          "$RUNNER_TEMP/psc-wheel/bin/psc" build Clean.psproj
          "$RUNNER_TEMP/psc-wheel/bin/python" -c "import sys; sys.path.insert(0, 'dist'); from clean.services import Hello; assert Hello().greet('ci') == 'Hello, ci!'"
