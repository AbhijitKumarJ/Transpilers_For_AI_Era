[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonsharp-compiler"
version = "0.3.0"
description = "PythonSharp (psc) - multi-pass static C#-to-Python 3.11+ transpiler"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "PythonSharp contributors" }]
dependencies = [
    "matplotlib>=3.8.0",
    "mypy>=1.10.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "polars>=1.0.0",
    "pyright>=1.1.350",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
    "typeshed-client>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
psc = "psc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"psc" = ["stdlib/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs", "Ideation", "tests/fixtures/golden/expected"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true

[tool.coverage.run]
source = ["psc"]

[tool.coverage.report]
fail_under = 90
show_missing = true
